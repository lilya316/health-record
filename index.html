<html data-page-node-id="KCWTbQDJB4fpLHGtXbJjcm" lang="zh-CN">

<title data-page-node-id="kb004qB3ZIIFOnFAqBWa3Y" data-pnid-children="Wu1m5HQudN6HD1WHIMyM1P">健康记录台 · 单机版</title>
<style data-page-node-id="4GExkv0zXGpITK699vCCwm" data-pnid-children="Qgfzw3Og4JIFcgUunJ2t84">
:root{
  --red:#FF6B87; --red-deep:#EE3F66; --pink-l:#FFDCE6; --pink-xl:#FFF0F5;
  --blue:#3B6EF5; --blue-l:#DCE8FD; --blue-d:#2E5BD8;
  --bg:#F3F5F9; --card:#FFFFFF;
  --t1:#1F2329; --t2:#7C8595; --t3:#A7AFBC; --line:#EEF1F6;
  --gold:#F0A93B; --ok:#25B36C;
  --r:16px; --sh:0 2px 10px rgba(31,35,41,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#E7EBF2; color:var(--t1); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{border:0;background:none;cursor:pointer;padding:0;}
input,textarea{-webkit-appearance:none;appearance:none;}

.app{
  max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
  box-shadow:0 0 50px rgba(31,35,41,.07);
}
.hidden{display:none !important;}

/* ---------- header ---------- */
.hd{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--line);
}
.hd-l{display:flex;align-items:center;gap:9px;}
.hd-logo{width:28px;height:28px;display:block;}
.hd-title{font-size:17px;font-weight:700;letter-spacing:.3px;}
.hd-r{display:flex;align-items:center;gap:8px;}
.sync{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--t2);
  background:#F4F6FA;padding:5px 9px;border-radius:20px;}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--t3);display:block;}
.sync.s-synced .sync-dot{background:var(--ok);}
.sync.s-syncing .sync-dot{background:var(--gold);animation:pulse 1s infinite;}
.sync.s-offline .sync-dot{background:#C3CAD6;}
/* ---------- 同步提示横幅 ---------- */
.offline-bar{display:none;align-items:flex-start;gap:8px;margin:10px 14px 0;padding:10px 12px;
  border-radius:12px;background:#FFF6E6;border:1px solid #FFE0A3;color:#8A6100;
  font-size:12.5px;line-height:1.5;cursor:pointer;text-align:left;}
.offline-bar.on{display:flex;}
.offline-bar b{font-weight:700;}
.offline-bar svg{flex:none;margin-top:1px;}
/* ---------- 同步诊断 ---------- */
.diag{margin-top:4px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.diag-row{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;font-size:12.5px;
  border-bottom:1px solid var(--line);align-items:flex-start;}
.diag-row:last-child{border-bottom:0;}
.diag-row>span{color:var(--t2);flex:none;}
.diag-row>b{font-weight:600;color:var(--t1);text-align:right;word-break:break-all;}
.diag-ok{color:#1F7A45 !important;}
.diag-bad{color:#C0392B !important;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--t2);transition:background .15s;}
.icon-btn:active{background:#F0F3F8;}

/* ---------- today strip ---------- */
.today-strip{margin:12px 14px 0;border-radius:var(--r);background:linear-gradient(135deg,#FFF1F4,#FFF8FA);
  border:1px solid #FFE1E9;padding:12px 13px;}
.ts-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.ts-title{font-size:13.5px;font-weight:700;color:var(--red-deep);}
.ts-badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;}
.ts-fold{margin-left:auto;font-size:12px;color:var(--t2);}
.ts-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px dashed #FFDDE6;}
.ts-row:first-of-type{border-top:0;}
.ts-txt{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ts-time{font-size:11.5px;color:var(--t2);flex:none;}
.ts-late{color:var(--red-deep);font-weight:600;}
.ts-done{width:26px;height:26px;flex:none;border-radius:50%;border:1.6px solid #FFB9CB;
  display:flex;align-items:center;justify-content:center;color:var(--red);}
.ts-done:active{background:#FFE6ED;}

/* ---------- layout ---------- */
.pane{display:none;padding:12px 14px 0;}
.pane.on{display:block;}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:15px;margin-bottom:12px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sec-title{font-size:15px;font-weight:700;}
.sec-date{font-size:12.5px;color:var(--t2);}
.link-btn{font-size:12.5px;color:var(--t2);}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
.cal-title{font-size:16px;font-weight:700;min-width:96px;text-align:center;}
.cal-today{font-size:12px;font-weight:700;color:var(--red-deep);background:#FFF0F4;
  border-radius:9px;padding:0 9px;min-height:26px;flex:none;}
.cal-today:active{background:var(--pink-l);}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.cal-week span{text-align:center;font-size:12px;color:var(--t3);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;}
.cell{position:relative;height:40px;display:flex;align-items:center;justify-content:center;}
.cell.blank{visibility:hidden;}
.dnum{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:14.5px;font-weight:600;color:var(--t1);transition:transform .12s;}
.cell:active .dnum{transform:scale(.9);}
.c-period .dnum{background:var(--red);color:#fff;box-shadow:0 3px 8px rgba(255,107,135,.35);}
.c-predperiod .dnum{background:var(--pink-l);color:#E2566F;}
.c-ovwin .dnum{background:var(--blue-l);color:var(--blue-d);}
.c-ovday .dnum{background:var(--blue);color:#fff;box-shadow:0 3px 8px rgba(59,110,245,.32);}
/* 选中/今天的外圈：用真实 border 画圆环，单圈、平滑无锯齿 */
.ring{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;
  transform:translate(-50%,-50%);border:2px solid #1F2329;
  display:none;pointer-events:none;backface-visibility:hidden;}
.is-sel .ring{display:block;}
.is-today:not(.is-sel) .ring{display:block;border-width:1.6px;border-color:rgba(31,35,41,.26);}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line);}
.legend span{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--t2);}
.dot{width:9px;height:9px;border-radius:50%;display:block;}
.d-period{background:var(--red);} .d-pred{background:var(--pink-l);}
.d-ovwin{background:var(--blue-l);} .d-ovday{background:var(--blue);}

/* ---------- phase card ---------- */
.phase-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.phase-name{font-size:16px;font-weight:700;}
.phase-sub{font-size:12.5px;color:var(--t2);margin-top:2px;}
.btn-ghost-pink{background:#FFF0F4;color:var(--red-deep);font-size:13px;font-weight:600;
  padding:9px 15px;border-radius:20px;flex:none;min-height:38px;}
.btn-ghost-pink:active{background:#FFE1EA;}
.btn-ghost-pink.end{background:var(--red);color:#FFF;box-shadow:0 4px 12px rgba(240,86,120,.34);}
.btn-ghost-pink.end:active{background:var(--red-deep);}
.btn-pair{display:flex;gap:10px;margin-top:14px;}
.act-btn{flex:1;min-height:46px;border:1.5px solid transparent;border-radius:14px;font-size:14.5px;
  font-weight:600;cursor:pointer;background:#F3F5F9;color:#8A93A2;font-family:inherit;
  transition:transform .12s,background .15s;}
.act-btn:active{transform:scale(.98);}
.act-btn.on{background:var(--red);color:#FFF;box-shadow:0 5px 14px rgba(240,86,120,.3);}
.act-btn.end.on{background:linear-gradient(135deg,#FF8FA8,var(--red));}
.act-btn.off{opacity:.55;cursor:default;}
.act-btn[disabled]{cursor:default;}
.act-btn[disabled]:active{transform:none;}
.pred-box{margin-top:13px;border-top:1px solid var(--line);padding-top:4px;}
.pred-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.pred-row:last-child{border-bottom:0;}
.pred-row span{color:var(--t2);flex:none;}
.pred-row b{font-weight:600;text-align:right;color:var(--t1);}
.pred-row b.hl{color:#3358D4;}
.pred-row b.hl2{color:#4A7BE8;font-size:12.5px;}
.pred-tag{font-style:normal;font-size:10.5px;font-weight:500;color:var(--t2);
  background:#F1F3F8;border-radius:6px;padding:2px 6px;margin-left:4px;}
.phase-bar{height:7px;border-radius:6px;background:#F1F3F8;margin-top:13px;overflow:hidden;}
.phase-bar-in{height:100%;border-radius:6px;background:linear-gradient(90deg,#FFB3C6,var(--red));width:0;
  transition:width .4s;}
.phase-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:8px;}

/* ---------- status panel ---------- */
.state-seg{display:flex;gap:8px;margin-bottom:4px;}
.seg-btn{flex:1;min-height:42px;border-radius:11px;background:#F4F6FA;font-size:13.5px;font-weight:600;
  color:var(--t2);border:1.5px solid transparent;transition:all .15s;}
.seg-btn.on{background:#FFF0F4;color:var(--red-deep);border-color:#FFC2D1;}
.grp{margin-top:13px;}
.grp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.grp-title{font-size:13.5px;font-weight:700;}
.grp-fold{width:26px;height:26px;border-radius:50%;background:#F4F6FA;display:flex;
  align-items:center;justify-content:center;color:var(--t2);}
.grp-fold svg{transition:transform .2s;}
.grp.closed .grp-fold svg{transform:rotate(180deg);}
.grp-items{display:grid;grid-template-columns:repeat(5,1fr);gap:13px 6px;}
.grp.closed .grp-items{display:none;}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;min-width:0;}
.opt .oi{width:53px;height:53px;display:block;border-radius:50%;transition:transform .12s;
  box-shadow:0 0 0 0 rgba(255,107,135,0);}
.opt:active .oi{transform:scale(.92);}
.opt.on .oi{box-shadow:0 0 0 2.5px var(--red);}
.opt-txt{font-size:11.5px;color:var(--t2);text-align:center;line-height:1.25;}
.opt.on .opt-txt{color:var(--red-deep);font-weight:600;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:20px;background:#F4F6FA;
  font-size:12.5px;color:var(--t2);border:1.5px solid transparent;min-height:38px;}
.chip.on{background:#FFF0F4;color:var(--red-deep);border-color:#FFC2D1;font-weight:600;}
.chip svg{width:15px;height:15px;display:block;}

/* ---------- inputs / buttons ---------- */
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--t2);margin-bottom:6px;}
.inp{width:100%;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:#FAFBFD;
  padding:10px 12px;font-size:16px;}
.inp:focus{border-color:var(--red);background:#fff;outline:none;}
/* 固定身高：只读展示行 */
.hfix{display:flex;align-items:center;justify-content:space-between;color:var(--t2);background:var(--bg);}
.hfix u{color:var(--red-deep);font-weight:600;font-size:13px;}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-primary{width:100%;min-height:46px;border-radius:12px;background:var(--red);color:#fff;
  font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(255,107,135,.3);}
.btn-primary:active{background:var(--red-deep);}
.btn-primary.wide{margin-bottom:12px;}
.btn-plain{width:100%;min-height:44px;border-radius:12px;background:#F4F6FA;color:var(--t1);font-size:14px;font-weight:600;}
.btn-danger{width:100%;min-height:44px;border-radius:12px;background:#FFF0F2;color:#E23B54;font-size:14px;font-weight:600;}
.hint{font-size:12px;color:var(--t3);text-align:center;margin-top:9px;min-height:16px;}
.memo-input-wrap{margin-top:14px;}

/* ---------- weight ---------- */
.stat-card{display:flex;align-items:center;gap:14px;
  background:linear-gradient(135deg,#EFF4FF,#F7F9FF);border:1px solid #E2EAFB;}
.stat-main{flex:1;min-width:0;}
.stat-label{font-size:12px;color:#6C7A99;}
.stat-value{font-size:34px;font-weight:800;line-height:1.15;color:#22345E;letter-spacing:-.5px;}
.stat-value small{font-size:14px;font-weight:600;color:#6C7A99;margin-left:3px;}
.stat-delta{font-size:12px;color:var(--t2);margin-top:3px;}
.stat-delta.up{color:#E2566F;} .stat-delta.down{color:var(--ok);}
.stat-side{display:flex;flex-direction:column;gap:8px;flex:none;}
.mini{background:#fff;border-radius:11px;padding:7px 12px;min-width:104px;display:flex;
  justify-content:space-between;align-items:baseline;gap:8px;box-shadow:0 1px 4px rgba(46,91,216,.07);}
.mini-k{font-size:11.5px;color:#6C7A99;}
.mini-v{font-size:15px;font-weight:700;color:#22345E;}
.meas-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.meas{background:#F7F8FC;border-radius:12px;padding:11px 12px;}
.meas-k{font-size:12px;color:var(--t2);}
.meas-v{font-size:19px;font-weight:700;margin-top:2px;}
.meas-v small{font-size:11px;font-weight:500;color:var(--t3);margin-left:2px;}
.meas.wide{grid-column:1/-1;}
/* ---------- 月度身体状态统计 ---------- */
.stat-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:11px;}
.stat-sum .meas{padding:9px 10px;}
.stat-sum .meas-v{font-size:16px;}
.stat-sum .meas-v small{font-size:10px;}
.stat-top{font-size:12.5px;color:#B3485F;background:#FFF3F6;border:1px solid #FFE0E8;
  border-radius:10px;padding:8px 11px;margin-bottom:12px;line-height:1.5;}
.stat-cat{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
  color:var(--t2);margin:13px 0 6px;}
.stat-cat::after{content:'';flex:1;height:1px;background:var(--line);}
.stat-row{display:flex;align-items:center;gap:9px;padding:4px 0;}
.stat-ic{width:29px;height:29px;flex:none;display:block;border-radius:50%;overflow:hidden;}
.stat-ic svg{width:100%;height:100%;display:block;}
.stat-n{width:64px;flex:none;font-size:12.5px;color:var(--t1);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.stat-bar{flex:1;min-width:26px;height:9px;border-radius:6px;background:#F1F3F8;overflow:hidden;}
.stat-bar i{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,#FFB3C6,var(--red));}
.stat-row.hot .stat-bar i{background:linear-gradient(90deg,#FFCF7A,#F0912B);}
.stat-v{width:48px;flex:none;text-align:right;font-size:12px;color:var(--t2);
  font-variant-numeric:tabular-nums;}
.stat-more{font-size:11.5px;color:var(--t3);padding:3px 0 0 38px;}
@media (max-width:400px){.stat-n{width:56px;font-size:12px;}.stat-v{width:44px;}}
/* 经期记录行 */
.ep-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);}
.ep-main{flex:1;min-width:0;}
.ep-date{font-size:13.5px;font-weight:700;}
.ep-sub{font-size:11.5px;color:var(--t2);display:block;margin-top:1px;}
.ep-btn{font-size:12.5px;font-weight:600;color:var(--red-deep);background:#FFF0F4;border-radius:9px;
  padding:0 11px;min-height:34px;flex:none;}
.ep-btn:active{background:#FFE1EA;}
.ep-btn.del{color:#8A93A2;background:#F4F6FA;}
.hist-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);}
.hist-item:first-child{border-top:0;}
.hist-date{font-size:12.5px;color:var(--t2);width:74px;flex:none;}
.hist-main{flex:1;font-size:14px;font-weight:600;min-width:0;}
.hist-sub{font-size:11.5px;color:var(--t3);font-weight:400;display:block;margin-top:1px;}
.hist-del{color:var(--t3);width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none;}
.chart-wrap{margin-bottom:8px;}

/* ---------- notes ---------- */
.note-grid{display:grid;grid-template-columns:1fr;gap:12px;padding-bottom:4px;}
.note{border-radius:14px;padding:13px 14px;position:relative;
  box-shadow:0 3px 10px rgba(31,35,41,.07);border:1px solid rgba(31,35,41,.04);}
.note.done{opacity:.62;}
.note.done .note-title{text-decoration:line-through;color:var(--t2);}
.note-top{display:flex;align-items:flex-start;gap:9px;}
.cbx{width:23px;height:23px;flex:none;border-radius:50%;border:2px solid rgba(31,35,41,.22);
  background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;
  color:#fff;margin-top:1px;}
.cbx.on{background:var(--ok);border-color:var(--ok);}
.note-title{font-size:14.5px;font-weight:700;flex:1;min-width:0;word-break:break-word;}
.note-body{font-size:13px;color:#4B5563;margin-top:5px;margin-left:32px;word-break:break-word;white-space:pre-wrap;}
.note-foot{display:flex;align-items:center;gap:8px;margin-top:9px;margin-left:32px;}
.remind{display:flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.75);color:#5A6472;}
.remind.late{background:rgba(255,90,120,.16);color:#D62B4C;font-weight:600;}
.remind.today{background:rgba(240,169,59,.2);color:#B4730B;font-weight:600;}
.note-del{position:absolute;right:9px;bottom:9px;color:rgba(31,35,41,.28);width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;}
.empty{text-align:center;color:var(--t3);font-size:13px;padding:26px 10px;}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:40;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;
  padding:7px 0 calc(7px + env(safe-area-inset-bottom));
}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;
  justify-content:center;color:var(--t3);}
.tb svg{width:23px;height:23px;display:block;}
.tb span{font-size:11px;}
.tb.on{color:var(--red);}
.tb.on[data-tab="weight"]{color:var(--blue);}
.tb.on[data-tab="memo"]{color:var(--gold);}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(20,24,32,.42);z-index:60;display:none;}
.mask.on{display:block;}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;
  background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease;}
@keyframes up{from{transform:translate(-50%,22px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-title{font-size:16.5px;font-weight:700;}
.sheet-x{width:32px;height:32px;border-radius:50%;background:#F4F6FA;display:flex;
  align-items:center;justify-content:center;color:var(--t2);}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;
  border-top:1px solid var(--line);}
.set-row:first-child{border-top:0;}
.set-name{font-size:14px;font-weight:600;}
.set-desc{font-size:11.5px;color:var(--t2);margin-top:2px;}
/* 开关 */
.sw{position:relative;display:block;width:48px;height:28px;flex:none;}
.sw input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2;}
.sw i{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:20px;background:#DFE4EC;
  transition:background .18s;pointer-events:none;}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s;}
.sw input:checked+i{background:var(--red);}
.sw input:checked+i::after{transform:translateX(20px);}

/* ---------- 笔记列表 ---------- */
.notes-hd{padding:2px 3px 12px;}
.notes-title{font-size:24px;font-weight:700;letter-spacing:-.3px;}
.notes-count{font-size:12.5px;color:var(--t2);margin-top:3px;}
.nfilter{display:flex;gap:8px;overflow-x:auto;padding:2px 3px 12px;}
.nfilter::-webkit-scrollbar{display:none;}
.nf{flex:none;border:1.5px solid transparent;background:#EEF1F6;color:#5C6675;font-size:13px;
  font-weight:600;padding:9px 15px;border-radius:12px;cursor:pointer;font-family:inherit;min-height:40px;}
.nf.on{background:#FFF;color:#1F2329;border-color:#D9DFE8;box-shadow:0 2px 8px rgba(31,35,41,.06);}
.nlist{display:flex;flex-direction:column;gap:10px;padding-bottom:10px;}
.ncard{background:#FFF;border-radius:14px;padding:14px 15px;box-shadow:0 2px 10px rgba(31,35,41,.05);
  cursor:pointer;border:1px solid #F1F4F8;}
.ncard:active{transform:scale(.99);}
.ncard-t{font-size:15px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ncard-s{font-size:12.5px;color:var(--t2);margin-top:5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ncard-f{display:flex;align-items:center;gap:8px;margin-top:9px;}
.ncard-d{font-size:11.5px;color:var(--t3);}
.ncard-b{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;
  background:#F3F5F9;color:#5C6675;border-radius:7px;padding:3px 7px;}
.ncard-b.late{background:#FFE9EF;color:#E23C5F;}
.ncard-b.today{background:#E6F0FF;color:#2A62D8;}
.ncard-todo{font-size:11.5px;color:var(--t2);margin-left:auto;}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(90px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#FFC46B,#F2A93B);
  color:#FFF;box-shadow:0 8px 22px rgba(242,169,59,.42);cursor:pointer;z-index:45;padding:0;
  display:flex;align-items:center;justify-content:center;}
.fab:active{transform:scale(.94);}

.np{position:fixed;inset:0;z-index:60;background:#FFF;display:none;flex-direction:column;

.np.on{display:flex;}
.np-hd{display:flex;align-items:center;gap:4px;padding:9px 10px;border-bottom:1px solid var(--line);flex:none;}

.np-ico:active{background:#F3F5F9;}
.np-hd-r{margin-left:auto;display:flex;align-items:center;gap:6px;}

.np-save:active{background:#DD971F;}
.np-scroll{flex:1;overflow-y:auto;padding:14px 18px 22px;}
.np-meta{font-size:11.5px;color:var(--t3);margin-bottom:10px;}
.np-title{width:100%;border:0;outline:none;font-size:22px;font-weight:700;color:#1F2329;
  padding:0;margin-bottom:12px;font-family:inherit;background:transparent;}
.np-title::placeholder{color:#C3CAD4;font-weight:600;}
.np-body{display:flex;flex-direction:column;gap:2px;}
.nl{display:flex;align-items:flex-start;gap:9px;padding:3px 0;}
.nl-txt{flex:1;min-width:0;border:0;outline:none;resize:none;background:transparent;

  min-height:33px;display:block;}
.nl-txt::placeholder{color:#C3CAD4;}
.nl-txt.done{color:var(--t3);text-decoration:line-through;}
.tck{width:22px;height:22px;border-radius:50%;border:1.8px solid #C9D0DA;background:#FFF;flex:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:#FFF;margin-top:7px;padding:0;}
.tck.on{background:#28B47C;border-color:#28B47C;}
.nl-img{position:relative;padding:4px 0;}
.nl-img img{width:100%;border-radius:12px;display:block;}
.nl-img-del{position:absolute;top:10px;right:8px;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(20,26,38,.55);color:#FFF;font-size:16px;cursor:pointer;line-height:1;padding:0;}
.np-bar{flex:none;display:flex;gap:6px;align-items:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:#FFF;overflow-x:auto;}
.np-bar::-webkit-scrollbar{display:none;}
.np-b{border:1.5px solid #E4E8EF;background:#FFF;border-radius:11px;padding:0 13px;height:40px;font-size:13px;
  font-weight:600;color:#4A5464;cursor:pointer;font-family:inherit;white-space:nowrap;
  display:flex;align-items:center;gap:5px;}
.np-b:active{background:#F5F7FA;}
.np-b.on{background:#FFF4E2;border-color:#F7CC85;color:#B47413;}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-14px);z-index:80;
  background:rgba(31,35,41,.9);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:22px;
  opacity:0;pointer-events:none;transition:all .22s;max-width:88vw;text-align:center;}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ================= 周期模型（纯计算，无 DOM） ================= */
function computePhaseInfo(cycleDay, cycleLen, periodLen, lastStart){
  if (!lastStart || cycleDay < 1) return null;
  var ovIdx = cycleLen - 14;
  if (ovIdx < periodLen + 3) ovIdx = periodLen + 3;
  var name, s;
  if (cycleDay <= periodLen){ name = '月经期'; s = 1; }
  else if (cycleDay < ovIdx - 1){ name = '卵泡期'; s = periodLen + 1; }
  else if (cycleDay <= ovIdx + 1){ name = '排卵期'; s = ovIdx - 2; if (s < periodLen + 1) s = periodLen + 1; }
  else { name = '黄体期'; s = ovIdx + 2; }
  var day = cycleDay - s + 1; if (day < 1) day = 1;
  return {
    name: name, day: day, cycleDay: cycleDay, cycleLen: cycleLen, ovIdx: ovIdx,
    progress: Math.min(100, Math.round(cycleDay / cycleLen * 100))
  };
}
function buildPeriodModel(){
  var actualPeriod = {}, actualOvDay = {}, actualOvWin = {};
  state.periodRows.forEach(function(row){
    var ds = fieldDate(row['日期']); if (!ds) return;
    var st = row['状态'] || '';
    if (st === '经期') actualPeriod[ds] = true;
    else if (st === '排卵日') actualOvDay[ds] = true;
    else if (st === '排卵期') actualOvWin[ds] = true;
  });
  var eps = [];
  Object.keys(actualPeriod).sort().forEach(function(ds){
    var d = parseD(ds); if (!d) return;
    var last = eps[eps.length - 1];
    if (last && diffDays(last.end, d) <= 2){ last.end = d; last.len = diffDays(last.start, d) + 1; }
    else eps.push({ start: d, end: d, len: 1 });
  });
  var cycleLen = state.cycleLen, periodLen = state.periodLen, autoCycle = false, autoLen = false, i, sum, avg;
  if (eps.length >= 2){
    var gaps = [];
    for (i = Math.max(1, eps.length - 6); i < eps.length; i++) gaps.push(diffDays(eps[i-1].start, eps[i].start));
    sum = 0; gaps.forEach(function(g){ sum += g; });
    avg = Math.round(sum / gaps.length);
    if (avg >= 15 && avg <= 60){ cycleLen = avg; autoCycle = true; }
  }
  if (eps.length >= 1){
    var tail = eps.slice(-6), lenSrc = tail;
    /* 正在进行中的这段还没结束，长度不完整，先不参与平均经期天数推算 */
    if (state.pending && tail.length && dstr(tail[tail.length - 1].start) === state.pending.start){
      lenSrc = tail.slice(0, -1);
    }
    if (lenSrc.length){
      sum = 0;
      lenSrc.forEach(function(e){ sum += e.len; });
      avg = Math.round(sum / lenSrc.length);
      if (avg >= 1 && avg <= 12){ periodLen = avg; autoLen = true; }
    }
  }
  var predPeriod = {}, predOvDay = {}, predOvWin = {};
  var lastStart = eps.length ? eps[eps.length - 1].start : null;
  /* 推算基准：优先用最近一次实际记录的经期开始日；一条记录都没有时用设置里的「本次月经第一天」 */
  var baseStart = lastStart;
  var usingManual = false;
  if (!baseStart && state.manualStart){
    baseStart = parseD(state.manualStart);
    usingManual = !!baseStart;
  }
  var cycleDay = 0, nextStart = null, ovDate = null, j, k;
  if (baseStart){
    cycleDay = diffDays(baseStart, todayDate()) + 1;
    if (cycleDay < 1) cycleDay = 1;
    /* 预测多少个周期：至少 6 个；若基准日离今天很远，补足到"今天之后再往后 3 个周期" */
    var need = 6;
    var gapN = Math.ceil(diffDays(baseStart, todayDate()) / cycleLen);
    if (isFinite(gapN) && gapN + 3 > need) need = gapN + 3;
    if (need > 60) need = 60;
    /* 用户公式（严格按这 4 步，避免「下次月经」和「排卵日」取自不同周期而对不上）：
       1) 基准 = 本次月经第一天（最近一次实际经期开始日；无记录时用设置里的「本次月经第一天」）
       2) 下次月经预估第一天 = 本次月经第一天 + 平均周期天数（若这天已过去，按整数个周期顺延到 >= 今天）
       3) 预估排卵日 = 下次月经预估第一天 − 14 天        ← 与上面同属一个周期
       4) 排卵期 = 排卵日前 5 天 至 排卵日后 4 天
       另外：为了日历上「未来的排卵期」仍可见，predPeriod/predOvDay/predOvWin 继续铺满后续多个周期。 */
    var k0 = 1, ns0 = addDays(baseStart, cycleLen * k0);
    while (ns0.getTime() < todayDate().getTime() && k0 < need){ k0++; ns0 = addDays(baseStart, cycleLen * k0); }
    nextStart = ns0;
    ovDate = addDays(nextStart, -14);
    for (k = 1; k <= need; k++){
      var ns = addDays(baseStart, cycleLen * k);
      /* 预测经期：从预估第一天起重叠 periodLen 天 */
      for (j = 0; j < periodLen; j++){
        var dp = dstr(addDays(ns, j));
        if (!actualPeriod[dp]) predPeriod[dp] = true;
      }
      /* 规则 3：排卵期 = 排卵日前 5 天 至 排卵日后 4 天（含排卵日当天） */
      var ov = addDays(ns, -14);
      var dOv = dstr(ov);
      if (!actualOvDay[dOv]) predOvDay[dOv] = true;
      for (j = -5; j <= 4; j++){
        var dw = dstr(addDays(ov, j));
        /* 排卵日当天只画深蓝，不再重复铺浅蓝 */
        if (j === 0) continue;
        if (!actualPeriod[dw] && !actualOvDay[dw] && !actualOvWin[dw] && !predOvDay[dw]) predOvWin[dw] = true;
      }
    }
  }
  return {
    actualPeriod: actualPeriod, actualOvDay: actualOvDay, actualOvWin: actualOvWin,
    predPeriod: predPeriod, predOvDay: predOvDay, predOvWin: predOvWin,
    episodes: eps, cycleLen: cycleLen, periodLen: periodLen,
    autoCycle: autoCycle, autoLen: autoLen,
    lastStart: lastStart, baseStart: baseStart, usingManual: usingManual,
    nextStart: nextStart, ovDate: ovDate, cycleDay: cycleDay,
    phase: computePhaseInfo(cycleDay, cycleLen, periodLen, baseStart)
  };
}

function fetchAll(qf, cursor, acc, guard){
  acc = acc || []; guard = guard || 0;
  if (guard > 100) return Promise.resolve(acc);
  return qf(cursor).then(function(res){
    acc = acc.concat(res.results || []);
    var next = res.nextCursor;
    if (res.hasMore && next && next !== cursor && (res.results || []).length){
      return fetchAll(qf, next, acc, guard + 1);
    }
    return acc;
  });
}

function unwrapProps(props){
  var o = {}, k, v;
  for (k in props){
    if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
    v = props[k];
    if (v == null){ o[k] = null; continue; }
    if (v.text !== undefined) o[k] = v.text;
    else if (v.number !== undefined) o[k] = v.number;
    else if (v.select !== undefined) o[k] = v.select;
    else if (v.multi_select !== undefined) o[k] = v.multi_select;
    else if (v.date !== undefined) o[k] = v.date;
    else if (v.checkbox !== undefined) o[k] = v.checkbox;
  }
  return o;
}

function localSave(t, rows){

  else if (MEM[t] !== rows){

    for (var i = 0; i < rows.length; i++) MEM[t].push(rows[i]);

  catch(e){

/* =========================================================
   本地优先数据层
   行上的 _dirty=1：本地改动还没推到云端
         _local=1：这条记录云端还不存在（id 是本机生成的）
   删除云端已有的记录时，把 id 记进「墓碑」，等连上云端再删。
   ========================================================= */
var TOMB_KEY = 'wb_health_tombs';
function tombMap(){
  if (MEM_TOMB) return MEM_TOMB;
  var o = null;
  try { o = JSON.parse(lsGet(TOMB_KEY) || '{}'); } catch(e){ o = null; }
  if (!o || typeof o !== 'object') o = {};
  MEM_TOMB = o;
  return MEM_TOMB;
}
function tombFlush(){ try { lsSet(TOMB_KEY, JSON.stringify(MEM_TOMB || {})); } catch(e){} }
function tombAll(kind){ var o = tombMap(); return o[kind] || []; }
function tombAdd(kind, id){
  if (!id) return;
  var o = tombMap();
  if (!o[kind]) o[kind] = [];
  if (o[kind].indexOf(id) < 0) o[kind].push(id);
  tombFlush();
}
function tombDrop(kind, ids){
  var o = tombMap();
  o[kind] = (o[kind] || []).filter(function(x){ return ids.indexOf(x) < 0; });
  tombFlush();
}

/* 写本地：立即生效，云端稍后同步 */
function localApply(kind, rid, props){
  var rows = localAll(kind), flat = unwrapProps(props), k, row = null, i;
  for (i = 0; i < rows.length; i++){ if (rows[i]._id === rid){ row = rows[i]; break; } }
  if (!row){
    row = {}; row._id = rid || uid(); row._local = 1; rows.push(row);
  }
  for (k in flat){ if (Object.prototype.hasOwnProperty.call(flat, k)) row[k] = flat[k]; }
  row._dirty = 1;
  localSave(kind, rows);
  return row._id;
}
function localRemove(kind, rid){
  var rows = localAll(kind), row = null, i;
  for (i = 0; i < rows.length; i++){ if (rows[i]._id === rid){ row = rows[i]; break; } }
  localSave(kind, rows.filter(function(r){ return r._id !== rid; }));
  if (row && !row._local) tombAdd(kind, rid);
  return !!row;
}

  rows.forEach(function(r){

}

/* 空值处理：新增记录时空字段必须「整个键不传」；更新记录时清空必须用内层 null（{date:null}）。

function cleanProps(props, isNew){
  var out = {}, k, v, ty;
  for (k in props){
    if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
    v = props[k];
    if (v === null || v === undefined){
      if (isNew) continue;
      ty = FIELD_TYPES[k];
      if (ty === 'date') out[k] = { date: null };
      else if (ty === 'checkbox') out[k] = { checkbox: false };
      else if (ty === 'number') out[k] = { number: null };
      else if (ty === 'multi_select') out[k] = { multi_select: [] };
      else if (ty === 'image') out[k] = { image: { images: [] } };

/* =========================================================
   云端同步引擎：拉取 → 合并 → 推送本地改动
   ========================================================= */
var syncTimer = null, syncRunning = null, syncCool = 0, syncMuteUntil = 0;
function queueSync(){
  if (isStandalone()){ setSync('local'); return; }   /* 纯本地模式：数据已落 localStorage，不需要排队推云端 */
  if (Date.now() < syncCool){
    if (!cloudReady()){ setSync('local'); return; }
    syncCool = 0;                        /* 通道已恢复，马上放行 */
  }
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncTimer = null; syncNow(); }, 250);
}
/* 单机版：没有云端可探，这两个入口保留为 no-op，避免调用点出错 */
function probeCloud(){ /* no-op */ }
function cloudReady(){ return false; }
/* 单机版：不存在「同步」。数据写入时已经直接落进 localStorage，这里只刷新状态显示。 */
function syncNow(force){
  setMode('local', '单机版：数据存在本机浏览器');
  return Promise.resolve('local');
}
function mergeFromCloud(arr){
  ['period', 'weight', 'memo'].forEach(function(kind, i){
    var raw = arr[i] || [];
    var local = localAll(kind);
    var tombs = tombAll(kind);
    var byId = {};
    raw.forEach(function(r){
      if (!r || !r._id) return;
      if (tombs.indexOf(r._id) >= 0) return;
      byId[r._id] = r;
    });
    var dirty = local.filter(function(r){ return r._dirty; });
    /* 保守：云端一条都没有而本机有数据时不动本机（可能是权限/过滤导致，避免误清空） */
    if (!Object.keys(byId).length && local.length && !dirty.length){
      state.lastWarn = kind + ' 云端返回 0 条，已保留本机数据';
      return;
    }
    dirty.forEach(function(r){ byId[r._id] = r; });   /* 未推送的本地改动优先 */
    localSave(kind, Object.keys(byId).map(function(k){ return byId[k]; }));
  });
}
var pushRunning = null;
/* 同一时刻只允许一个推送在跑，避免同一条新记录被推两次 */
function pushChanges(){
  if (pushRunning) return pushRunning;
  pushRunning = doPushChanges().then(function(r){ pushRunning = null; return r; },
    function(e){ pushRunning = null; throw e; });
  return pushRunning;
}
function doPushChanges(){
  var chain = Promise.resolve();
  ['period', 'weight', 'memo'].forEach(function(kind){
    chain = chain.then(function(){
      var rows = dirtyRows(kind), seq = Promise.resolve();
      rows.forEach(function(row){
        seq = seq.then(function(){ return pushOneRow(kind, row); });
      });
      return seq.then(function(){ return pushTombs(kind); });
    });
  });
  return chain;
}
/* 切后台 / 关页面之前调用：只推不拉，尽量把改动塞进云端 */
function pushDirtyNow(){
  if (!pendingCount()) return Promise.resolve('nothing');
  if (!db || !cloudReady()) return Promise.resolve('offline');
  setSync('syncing');
  return pushChanges().then(function(){
    setSync(pendingCount() ? 'local' : 'synced');
    return 'pushed';
  }).catch(function(err){
    console.warn('[sync] 立即推送失败，改动仍留在本机等待重试', err);
    setSync('local');
    return 'local';
  });
}
function pushOneRow(kind, row){
  var props = rowToProps(kind, row);
  if (!Object.keys(props).length){ clearDirty(kind, row._id, null); return Promise.resolve(); }
  var isNew = !!row._local;
  var call = isNew ? addRow(kind, props) : updRow(kind, row._id, props);
  return call.then(function(res){
    clearDirty(kind, row._id, (isNew && res && res.id) ? res.id : null);
  });
}
function pushTombs(kind){
  var ids = tombAll(kind).slice();
  if (!ids.length) return Promise.resolve();
  var seq = Promise.resolve(), done = [];
  ids.forEach(function(id){
    seq = seq.then(function(){
      return delRow(kind, id).then(function(){ done.push(id); }, function(){ done.push(id); });
    });
  });
  return seq.then(function(){ tombDrop(kind, done); });
}

/* 取字段值并统一成数组：多选是数组，单选（分泌物）与旧数据可能是字符串，

function monthStatData(ym){
  var byDate = {}, ds, i, j;
  state.periodRows.forEach(function(r){
    ds = fieldDate(r['日期']);

    if (!byDate[ds]) byDate[ds] = [];

      if (r['状态'] === '经期') isP = true;
      GROUPS.forEach(function(g){
        var arr = statVals(r[g.key]);
        for (j = 0; j < arr.length; j++){
          if (!arr[j]) continue;
          if (seen[g.key + '|' + arr[j]]) continue;
          seen[g.key + '|' + arr[j]] = 1;
          if (!items[g.key]) items[g.key] = {};
          items[g.key][arr[j]] = (items[g.key][arr[j]] || 0) + 1;
        }
      });
      /* 老数据兼容：旧「其他症状」并入「身体症状」 */
      for (var lk in LEGACY_SEL){
        if (!Object.prototype.hasOwnProperty.call(LEGACY_SEL, lk)) continue;

function buildWeightChart(rows){
  var pts = rows.slice(-12).filter(function(r){ return r['体重'] != null; });
  if (pts.length < 2) return '';
  var W = 300, H = 112, P = 16, i;
  var vals = [];
  pts.forEach(function(r){ vals.push(Number(r['体重'])); });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mx - mn < 1){ mx += 0.6; mn -= 0.6; }
  var span = mx - mn, stepX = (W - P * 2) / (pts.length - 1);
  var coords = [];
  for (i = 0; i < pts.length; i++){
    coords.push([Math.round((P + i * stepX) * 10) / 10,
      Math.round((P + (H - P * 2) * (1 - (Number(pts[i]['体重']) - mn) / span)) * 10) / 10]);
  }
  var line = '';
  for (i = 0; i < coords.length; i++){ line += (i ? 'L' : 'M') + coords[i][0] + ' ' + coords[i][1] + ' '; }
  var area = line + 'L' + coords[coords.length - 1][0] + ' ' + (H - P) + ' L' + coords[0][0] + ' ' + (H - P) + ' Z';
  var dots = '';
  for (i = 0; i < coords.length; i++){
    dots += '<circle cx="' + coords[i][0] + '" cy="' + coords[i][1] + '" r="2.6" fill="#3B6EF5" stroke="#fff" stroke-width="1.4"/>';
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' +
    '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#3B6EF5" stop-opacity="0.22"/>' +
    '<stop offset="100%" stop-color="#3B6EF5" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#wg)"/>' +
    '<path d="' + line + '" fill="none" stroke="#3B6EF5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    dots + '</svg>';
}
function bmiTag(bmi){
  if (bmi == null) return '—';
  if (bmi < 18.5) return '偏瘦';
  if (bmi < 24) return '正常';
  if (bmi < 28) return '偏胖';
  return '肥胖';
}

  if (!row) return '';

function normLine(l){
  if (!l || typeof l !== 'object') return { t: 'text', v: String(l == null ? '' : l) };
  if (l.t === 'img') return { t: 'img', u: String(l.u || ''), name: String(l.name || '') };
  if (l.t === 'todo') return { t: 'todo', v: String(l.v == null ? '' : l.v), done: !!l.done };
  return { t: 'text', v: String(l.v == null ? '' : l.v) };
}
function parseNoteLines(row){
  if (!row) return [];
  var raw = row['正文'];
  if (raw){
    var arr = null;
    try { arr = JSON.parse(String(raw)); } catch(e){ arr = null; }
    if (arr && arr.length) return arr.map(normLine);
    return String(raw).split('\n').map(function(s){ return { t: 'text', v: s }; });
  }
  var out = [], c = row['内容'];
  if (c) String(c).split('\n').forEach(function(s){ if (s !== '') out.push({ t: 'text', v: s }); });
  return out;
}
function noteTextOf(lines){
  var parts = [], imgs = 0;
  lines.forEach(function(l){
    if (l.t === 'img'){ imgs++; return; }
    var v = String(l.v || '').trim();
    if (v) parts.push(v);
  });
  var s = parts.join(' · ');
  if (imgs) s += (s ? ' · ' : '') + '［' + imgs + ' 张图片］';
  return s;
}
function noteTodoStat(lines){
  var total = 0, done = 0;
  lines.forEach(function(l){ if (l.t === 'todo'){ total++; if (l.done) done++; } });

}

function fmtNoteDate(ds){

  var wk = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];

/* ---------- 笔记草稿 + 待上传图片缓存（IndexedDB） ----------
   选好图但还没上传成功时（例如未登录被跳转、页面重载），图片字节会留在
   IndexedDB 里，草稿留在 localStorage，回到页面后自动补传，避免白选一场。 */
var NOTE_DRAFT_KEY = 'wb_health_note_draft';
var IMG_DB = 'sp_form_img', IMG_STORE = 'f';
var IMG_FLAG = 'sp_img_flag_' + (typeof location !== 'undefined' ? location.pathname : '');
function imgKeyOf(i){ return (typeof location !== 'undefined' ? location.pathname : '') + '::图片#' + i; }
function imgOpenDb(){
  return new Promise(function(resolve, reject){
    if (typeof indexedDB === 'undefined'){ reject(new Error('无 IndexedDB')); return; }
    var req;
    try { req = indexedDB.open(IMG_DB); } catch(e){ reject(e); return; }
    req.onupgradeneeded = function(){
      var dx = req.result;
      if (!dx.objectStoreNames.contains(IMG_STORE)) dx.createObjectStore(IMG_STORE);
    };
    req.onsuccess = function(){
      var dx = req.result;
      if (dx.objectStoreNames.contains(IMG_STORE)){ resolve(dx); return; }
      var ver = dx.version + 1;
      try { dx.close(); } catch(e){}
      var r2 = indexedDB.open(IMG_DB, ver);
      r2.onupgradeneeded = function(){ r2.result.createObjectStore(IMG_STORE); };
      r2.onsuccess = function(){ resolve(r2.result); };
      r2.onerror = function(){ reject(r2.error || new Error('打开失败')); };
    };
    req.onerror = function(){ reject(req.error || new Error('打开失败')); };
    req.onblocked = function(){ reject(new Error('被占用')); };
  });
}
function imgPutBlob(i, blob){
  return imgOpenDb().then(function(dx){
    return new Promise(function(resolve, reject){
      var tx;
      try { tx = dx.transaction(IMG_STORE, 'readwrite'); } catch(e){ reject(e); return; }
      var st = tx.objectStore(IMG_STORE);
      st.put(blob, imgKeyOf(i));
      tx.oncomplete = function(){ try { dx.close(); } catch(e){} resolve(true); };
      tx.onerror = function(){ try { dx.close(); } catch(e){} reject(tx.error || new Error('写入失败')); };
    });
  });
}
function imgGetBlob(i){
  return imgOpenDb().then(function(dx){
    return new Promise(function(resolve){
      var tx;
      try { tx = dx.transaction(IMG_STORE, 'readonly'); } catch(e){ resolve(null); return; }
      var st = tx.objectStore(IMG_STORE);
      var rq = st.get(imgKeyOf(i));
      rq.onsuccess = function(){ resolve(rq.result || null); };
      rq.onerror = function(){ resolve(null); };
      tx.oncomplete = function(){ try { dx.close(); } catch(e){} };
    });
  });
}
function imgClearBatch(n){
  if (!(n > 0)) return Promise.resolve(false);
  return imgOpenDb().then(function(dx){
    return new Promise(function(resolve){
      var tx;
      try { tx = dx.transaction(IMG_STORE, 'readwrite'); } catch(e){ resolve(false); return; }
      var st = tx.objectStore(IMG_STORE);
      for (var i = 0; i < n; i++) st.delete(imgKeyOf(i));
      tx.oncomplete = function(){ try { dx.close(); } catch(e){} resolve(true); };
      tx.onerror = function(){ resolve(false); };
    });
  }).catch(function(){ return false; });
}

function compressImage(file, maxW, quality){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('读取图片失败')); };
    reader.onload = function(){
      var rawUrl = String(reader.result || '');
      var img = new Image();
      img.onerror = function(){ reject(new Error('图片解析失败')); };
      img.onload = function(){
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h){ reject(new Error('图片尺寸异常')); return; }
        if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        try {
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          var out = cv.toDataURL('image/jpeg', quality);
          resolve({ dataUrl: out, base64: String(out).split(',')[1] || '', type: 'image/jpeg', width: w, height: h });
        } catch(e){
          resolve({ dataUrl: rawUrl, base64: String(rawUrl).split(',')[1] || '', type: file.type || 'image/jpeg', width: w, height: h });
        }
      };
      img.src = rawUrl;
    };
    reader.readAsDataURL(file);
  });
}
function onNoteFile(e){

  if (String(file.type).indexOf('image/') !== 0){ toast('请选择图片文件'); return; }
  if (file.size > 10 * 1024 * 1024){ toast('图片不能超过 10MB'); return; }
  var localMode = !(db && typeof db.uploadImage === 'function');
  if (localMode){
    var imgCnt = 0;
    state.note.lines.forEach(function(l){ if (l.t === 'img') imgCnt++; });
    if (imgCnt >= 4){ toast('本地模式下最多插 4 张图'); return; }
  }
  toast('正在处理图片…');
  if (!localMode){
    imgPutBlob(0, file).then(function(){
      try { lsSet(IMG_FLAG, JSON.stringify({ n: 1, ts: Date.now() })); } catch(e){}
    }).catch(function(err){ console.error('[image] 缓存待上传图片失败', err); });
  }
  compressImage(file, localMode ? 900 : 1280, localMode ? 0.72 : 0.82).then(function(res){
    if (!localMode){
      return db.uploadImage({ data: res.base64, contentType: res.type, fileName: file.name })
        .then(function(r){
          if (!r || !r.url) throw new Error('上传未返回 url');
          state.note.lines.push({ t: 'img', u: r.url, name: file.name });

          imgClearBatch(1); lsDel(IMG_FLAG);
          toast('图片已插入');

    state.note.lines.push({ t: 'img', u: res.dataUrl, name: file.name });
    renderNoteEditor(); saveNoteDraft(); toast('图片已插入（离线模式，仅本机可见）');
  }).catch(function(err){
    console.error('[image] 插图失败', err);

function reloadAll(silent){
  if (!silent) setSync('syncing');
  applyRowsFromLocal();
  state.loaded = true;
  syncSelFromDate();
  refreshAll();                 /* 先用手上的数据把界面画出来，不等网络 */
  return syncNow()              /* 再读云端：合并 → 推送 → 刷新 */
    .then(function(){
      restorePendingFromRow();  /* 「经期进行中」状态从云端记录里恢复 */
      /* 修复：不再在打开页面时自动灌入示例数据，避免「每次打开数据都不一样」。
         如需示例数据，可在设置中手动导入。 */
    })
    .then(function(){
      applyRowsFromLocal();
      /* 只有「本机没记住、靠云端恢复」时才重刷表单，避免冲掉用户正在填的内容 */
      if (restoreViewFromRow()) syncSelFromDate();
      refreshAll();
      setSync(pendingCount() ? 'local' : (state.syncKind === 'synced' ? 'synced' : state.syncKind));
      return null;
    });
}

function submitPeriodForm(form){
  var g = function(n){ var el = form.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
  var sd = parseD(g('开始日期'));
  var len = Math.round(Number(g('天数')));
  if (!sd){ toast('请先选择经期开始日期'); return; }
  if (!(len >= 1 && len <= 12)){ toast('经期天数请填 1-12 天'); return; }
  var newDates = [], i;
  for (i = 0; i < len; i++) newDates.push(dstr(addDays(sd, i)));
  var oldDates = [];
  if (state.editEpisode){
    oldDates = episodeDates({ start: parseD(state.editEpisode.start), len: state.editEpisode.len });
  }
  var toDrop = oldDates.filter(function(d){ return newDates.indexOf(d) < 0; });
  var toAdd = newDates.filter(function(d){ return oldDates.indexOf(d) < 0; });
  /* 改的若正是「进行中」那段，起始日跟着一起挪，不打断进行中状态 */
  var wasPending = !!(state.pending && state.editEpisode && state.pending.start === state.editEpisode.start);
  var btn = form.querySelector('button[type="submit"]');
  if (btn){ btn.disabled = true; btn.textContent = '保存中…'; }
  setSync('syncing');
  clearPeriodMarks(toDrop)
    .then(function(){ return clearMonthPeriodMarks(newDates[0], newDates); })
    .then(function(){ return markPeriodDates(toAdd); }).then(function(){
    if (wasPending){
      var tNow = todayStr();
      if (dstr(newDates[newDates.length - 1]) >= tNow){
        state.pending = { start: newDates[0] };
        state.pendingCovered = tNow;
      } else {
        state.pending = null;
        state.pendingCovered = '';
      }
      savePending();
    }
    closeSheet(); state.editEpisode = null;
    toast('已记录 ' + mmdd(newDates[0]) + ' 起 ' + len + ' 天经期');
    return reloadAll(true);
  }).catch(function(err){
    console.error('[database] 经期日期保存失败', err);
    toast('保存失败，请重试'); setSync('offline');
    if (btn){ btn.disabled = false; btn.textContent = '保存'; }
  });
}

var FIELD_TYPES = {
  '日期':'date', '记录日期':'date', '提醒日期':'date',
  '状态':'select', '分泌物':'select',
  '心情感受':'multi_select', '身体症状':'multi_select', '睡眠状况':'multi_select',
  '皮肤状态':'multi_select', '其他症状':'multi_select',
  '身高':'number', '体重':'number', '胸围':'number', '腰围':'number', '臀围':'number',
  '大腿围':'number', '肩宽':'number',
  '已完成':'checkbox',
  '图片':'image'
};
var FIELD_LIST = {
  period: ['日期','状态','心情感受','身体症状','睡眠状况','皮肤状态','分泌物','其他症状','备注'],
  weight: ['记录日期','身高','体重','胸围','腰围','臀围','大腿围','肩宽','备注'],
  memo: ['标题','正文','日期','图片','提醒日期','提醒时间','已完成','内容','待办事项','备注']
};
function rowToProps(kind, row){
  var props = {};
  FIELD_LIST[kind].forEach(function(f){
    var val = row[f];
    if (val == null || val === '') return;
    var ty = FIELD_TYPES[f] || 'text';
    if (ty === 'date') props[f] = { date: fieldDate(val) || String(val) };
    else if (ty === 'select') props[f] = { select: String(val) };
    else if (ty === 'multi_select') props[f] = { multi_select: val };
    else if (ty === 'number') props[f] = { number: Number(val) };
    else if (ty === 'checkbox') props[f] = { checkbox: !!val };
    else if (ty === 'image'){
      if (val && val.length) props[f] = { image: { images: val } };
    }
    else props[f] = { text: String(val) };
  });
  return props;
}
/* 幂等合并：按「日期 + 主要字段签名」去重。同一条记录重复导入只覆盖不新增。
   period 签名 = 日期；weight 签名 = 记录日期；memo 签名 = 标题+正文（无标题时用提醒日期）。 */
function importJson(file){
  var reader = new FileReader();
  reader.onload = function(){
    var data;
    try { data = JSON.parse(String(reader.result)); }
    catch(e){ toast('文件格式不正确'); return; }
    if (!data || (typeof data !== 'object')){ toast('文件格式不正确'); return; }
    var stats = { period: { add: 0, skip: 0 }, weight: { add: 0, skip: 0 }, memo: { add: 0, skip: 0 } };
    function rowSig(kind, r){
      if (kind === 'period') return 'p:' + (r['日期'] || '');
      if (kind === 'weight') return 'w:' + (r['记录日期'] || '');
      var t = (r['标题'] || '') + '|' + (r['正文'] || '');
      return 'm:' + (t || (r['提醒日期'] || ''));
    }
    function mergeKind(kind, incoming){
      var local = localAll(kind);
      var seen = {};
      local.forEach(function(r){ var s = rowSig(kind, r); if (s.length > 2) seen[s] = r._id || ''; });
      (incoming || []).forEach(function(r){
        if (!r || typeof r !== 'object') return;
        var s = rowSig(kind, r);
        var props = rowToProps(kind, r);
        if (!Object.keys(props).length){ stats[kind].skip++; return; }
        if (s.length > 2 && seen[s]){
          /* 已有同签名记录：覆盖更新（用现有 _id，不新建） */
          saveRow(kind, seen[s], props); stats[kind].skip++;
        } else {
          saveRow(kind, null, props); stats[kind].add++;
          if (s.length > 2) seen[s] = 'pending';
        }
      });
    }
    mergeKind('period', data.period);
    mergeKind('weight', data.weight);
    mergeKind('memo', data.memo);
    var totalAdd = stats.period.add + stats.weight.add + stats.memo.add;
    var totalSkip = stats.period.skip + stats.weight.skip + stats.memo.skip;
    if (!totalAdd && !totalSkip){ toast('备份文件里没有数据'); return; }
    if (data.settings){
      if (data.settings.cycleLen) state.cycleLen = Number(data.settings.cycleLen) || state.cycleLen;
      if (data.settings.periodLen) state.periodLen = Number(data.settings.periodLen) || state.periodLen;
      if (data.settings.manualStart) state.manualStart = fieldDate(data.settings.manualStart) || state.manualStart;
      saveSettings();
    }
    queueSync();
    Promise.resolve().then(function(){
      return reloadAll(true);
    }).then(function(){
      closeSheet(); toast('导入完成：新增 ' + totalAdd + ' 条，覆盖 ' + totalSkip + ' 条');
    }).catch(function(err){ console.error('[database] 导入失败', err); toast('导入失败，请重试'); });
  };
  reader.onerror = function(){ toast('读取文件失败'); };
  reader.readAsText(file);
}

  } else if (act === 'clearSamples'){
    if (!window.confirm('确定删除全部示例数据？')) return;
    setSync('syncing');
    clearSamples().then(function(){ toast('示例数据已清空'); return reloadAll(true); });
  } else if (act === 'clearAll'){
    if (!window.confirm('确定清空全部数据？此操作不可恢复！')) return;
    if (!window.confirm('再次确认：真的要删除所有经期、体重、便签记录吗？')) return;
    setSync('syncing');
    clearAll().then(function(){ toast('全部数据已清空'); return reloadAll(true); });
  } else if (act === 'closeSheet'){
    closeSheet();
  }
}
function onDocClick(e){
  var node = e.target, el = null, guard = 0;
  while (node && node !== document && guard < 40){
    if (node.getAttribute && node.getAttribute('data-act')){ el = node; break; }
    node = node.parentNode; guard++;
  }
  if (!el) return;
  onAct(el.getAttribute('data-act'), el);
}
function onDocSubmit(e){
  var form = e.target;
  if (!form || !form.id) return;
  if (form.id === 'wForm'){ e.preventDefault(); submitWeightForm(form); }
  else if (form.id === 'nrForm'){ e.preventDefault(); submitNoteRemind(form); }
  else if (form.id === 'pForm'){ e.preventDefault(); submitPeriodForm(form); }
}

/* ================= 初始化 ================= */
function init(){
  loadSettings();
  document.addEventListener('click', onDocClick);
  document.addEventListener('input', onDocInput);
  document.addEventListener('keydown', onDocKeydown);
  document.addEventListener('change', onDocChange);
  document.addEventListener('submit', onDocSubmit);
  document.addEventListener('input', function(e){
    if (e.target && e.target.id === 'periodNote'){
      try { localStorage.setItem(DRAFT_KEY.period, e.target.value); } catch(err){}
    }
  });
  var file = document.getElementById('importFile');
  if (file){
    file.addEventListener('change', function(){
      if (file.files && file.files[0]){ importJson(file.files[0]); file.value = ''; }
    });
  }
  var mask = document.getElementById('sheetMask');
  if (mask){
    mask.addEventListener('click', function(e){ if (e.target === mask) closeSheet(); });
  }
  probeStorage();
  setMode('local', '单机版：数据存在本机浏览器');
  refreshAll();
  /* 单机版：每次操作都已直接写进 localStorage，切后台 / 关页面不需要额外推送 */
  reloadAll().then(function(){ return syncOngoingPeriod(); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();



})();
</script>
